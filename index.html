<style>

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: Inter, system-ui, sans-serif; color: var(--ink); background: var(--bg); line-height: 1.45; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 0 20px; }
  header { background: #000; color: #fff; border-bottom: 5px solid var(--accent); padding: 28px 0 30px; }
  header .crest { height: 72px; width: auto; display: block; margin-bottom: 18px; }
  header .org { font-size: 12px; letter-spacing: .04em; text-transform: uppercase; margin: 0 0 6px; }
  header h1 { font-size: clamp(30px, 6vw, 42px); line-height: 1.1; margin: 0 0 12px; font-weight: 700; letter-spacing: -.01em; }
  header p.lead { max-width: 520px; font-size: 14.5px; margin: 0 0 20px; color: #E8ECF6; }
  .stats { display: flex; flex-wrap: wrap; gap: 14px 30px; }
  .stats b { display: block; font-size: 24px; line-height: 1.1; }
  .stats span { font-size: 11.5px; color: #C9D0E2; }
  main.wrap { padding-top: 26px; padding-bottom: 40px; }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; }
  .tools input { flex: 1 1 260px; min-width: 0; height: 42px; border: 1px solid var(--line); border-radius: 4px; padding: 0 14px; font: inherit; font-size: 14.5px; color: var(--ink); background: #fff; }
  .tools input:focus, .tools select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .tools button, .tools select { height: 42px; padding: 0 14px; border: 1px solid var(--line); background: #fff; border-radius: 4px; font: 13px "IBM Plex Mono", monospace; color: var(--ink); cursor: pointer; text-transform: uppercase; }
  .tools button.on { background: var(--chip); border-color: var(--ink); }
  .count { font: 12px "IBM Plex Mono", monospace; color: var(--ink2); margin: 12px 0 22px; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
  .pk { margin: 0 0 28px; }
  .pk h2 { font-size: 19px; font-weight: 600; margin: 0 0 4px; }
  .pk .pkm { font: 12px "IBM Plex Mono", monospace; color: var(--ink2); margin: 0 0 10px; }
  .list { background: #fff; border: 1px solid var(--line); border-radius: 4px; }
  .row { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: center; padding: 11px 14px; border-top: 1px solid var(--line); text-decoration: none; color: inherit; }
  .row:first-child { border-top: 0; }
  .row:hover { background: #F7F9FE; }
  .row b { font-size: 14.5px; font-weight: 600; }
  .row small { display: block; font-size: 12.5px; color: var(--ink2); }
  .row .area { font: 12px "IBM Plex Mono", monospace; color: var(--ink2); text-align: right; white-space: nowrap; }
  .tag { font: 11px "IBM Plex Mono", monospace; text-transform: uppercase; border: 1px solid; border-radius: 3px; padding: 2px 7px; }
  .tag.Basah { color: var(--wet); }
  .tag.Kering { color: var(--dry); }
  .empty { padding: 30px 0; color: var(--ink2); }
  .back { font: 12px "IBM Plex Mono", monospace; color: var(--ink2); text-decoration: none; display: inline-block; margin-bottom: 22px; }
  .back:hover { color: var(--ink); }
  .eyebrow { font: 11px "IBM Plex Mono", monospace; letter-spacing: .04em; text-transform: uppercase; color: var(--ink2); margin: 0 0 6px; }
  .detail h2 { font-size: clamp(24px, 5vw, 30px); margin: 0 0 4px; line-height: 1.15; }
  .detail .addr { color: var(--ink2); font-size: 14px; margin: 0 0 18px; padding-bottom: 16px; border-bottom: 2px solid var(--ink); }
  dl.grid { display: grid; grid-template-columns: 1fr 1fr; background: #fff; border: 1px solid var(--line); border-radius: 4px; margin: 0; }
  dl.grid div { padding: 12px 14px; border-bottom: 1px solid var(--line); }
  dl.grid div:nth-child(odd) { border-right: 1px solid var(--line); }
  dl.grid div.full { grid-column: 1 / -1; border-right: 0; }
  dl.grid dt { font: 10.5px "IBM Plex Mono", monospace; text-transform: uppercase; color: var(--ink2); letter-spacing: .03em; margin-bottom: 3px; }
  dl.grid dd { margin: 0; font-weight: 600; }
  dl.grid a { color: var(--accent); font-weight: 600; text-decoration: none; font-size: 14px; }
  .note { font-size: 12.5px; color: var(--ink2); margin-top: 22px; }
  footer { border-top: 1px solid var(--line); padding: 18px 0 30px; font: 12px "IBM Plex Mono", monospace; color: var(--ink3); }
  @media (max-width: 560px) {
    dl.grid { grid-template-columns: 1fr; }
    dl.grid div:nth-child(odd) { border-right: 0; }
    .row { grid-template-columns: 1fr auto; }
    .row .area { display: none; }
  }
</style>

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = (n, d = 0) => n.toLocaleString('en-MY', { minimumFractionDigits: d, maximumFractionDigits: d });
const slug = (id) => id.toLowerCase();
const dms = (v, pos, neg) => {
  const a = Math.abs(v), d = Math.floor(a), mf = (a - d) * 60, m = Math.floor(mf), s = (mf - m) * 60;
  return `${d}°${String(m).padStart(2, '0')}'${s.toFixed(1).padStart(4, '0')}"${v >= 0 ? pos : neg}`;
};
const PAKEJ = [...new Set(PONDS.map((p) => p.pk))].sort();
const state = { q: '', jenis: 'SEMUA', pk: '' };

// statistik
const basah = PONDS.filter((p) => p.jenis === 'Basah').length;
const totalLuas = PONDS.reduce((a, p) => a + p.luas, 0);
$('#stats').innerHTML = [
  [PONDS.length, 'jumlah kolam'], [PAKEJ.length, 'pakej'], [new Set(PONDS.map((p) => p.tm)).size, 'kawasan'],
  [basah, 'kolam basah'], [PONDS.length - basah, 'kolam kering'], [num(totalLuas) + ' m²', 'jumlah keluasan'],
].map(([b, s]) => `<div><b>${b}</b><span>${s}</span></div>`).join('');

function listView() {
  const q = state.q.toLowerCase();
  const shown = PONDS.filter((p) =>
    (state.jenis === 'SEMUA' || p.jenis.toUpperCase() === state.jenis) &&
    (!state.pk || p.pk === state.pk) &&
    (!q || `${p.id} ${p.tm} ${p.jl} ${p.ptd} pakej ${p.pk}`.toLowerCase().includes(q)));
  const groups = PAKEJ.map((pk) => [pk, shown.filter((p) => p.pk === pk)]).filter(([, l]) => l.length);
  $('#view').innerHTML = `
    <div class="tools">
      <input id="q" type="search" placeholder="Cari no. kolam, taman, jalan atau PTD…" value="${esc(state.q)}" aria-label="Cari kolam">
      ${['SEMUA', 'BASAH', 'KERING'].map((j) => `<button data-j="${j}" class="${state.jenis === j ? 'on' : ''}">${j}</button>`).join('')}
      <select id="pk" aria-label="Pakej"><option value="">Semua pakej</option>${PAKEJ.map((p) => `<option value="${p}" ${state.pk === p ? 'selected' : ''}>Pakej ${p}</option>`).join('')}</select>
    </div>
    <div class="count">${shown.length} daripada ${PONDS.length} kolam dipaparkan</div>
    ${groups.length ? groups.map(([pk, l]) => {
      const all = PONDS.filter((p) => p.pk === pk);
      return `<section class="pk"><h2>Pakej ${pk}</h2>
        <div class="pkm">${all.length} kolam · ${num(all.reduce((a, p) => a + p.luas, 0), 2)} m²</div>
        <div class="list">${l.map((p) => `<a class="row" href="#/kolam/${slug(p.id)}">
          <div><b class="mono">${p.id}</b> &nbsp;<b>${esc(p.tm)}</b><small>${esc(p.jl)}</small></div>
          <span class="area">${num(p.luas, 2)} m²</span>
          <span class="tag ${p.jenis}">${p.jenis}</span></a>`).join('')}</div></section>`;
    }).join('') : '<div class="empty">Tiada kolam sepadan.</div>'}`;
  const qi = $('#q');
  qi.addEventListener('input', (e) => { state.q = e.target.value; const pos = e.target.selectionStart; listView(); const n = $('#q'); n.focus(); n.setSelectionRange(pos, pos); });
  document.querySelectorAll('[data-j]').forEach((b) => b.addEventListener('click', () => { state.jenis = b.dataset.j; listView(); }));
  $('#pk').addEventListener('change', (e) => { state.pk = e.target.value; listView(); });
}

function detailView(p) {
  const maps = `https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}`;
  const f = (k, v, cls = '') => `<div class="${cls}"><dt>${k}</dt><dd>${v}</dd></div>`;
  $('#view').innerHTML = `<div class="detail">
    <a class="back" href="#/">← kembali ke senarai</a>
    <p class="eyebrow">${p.id} · Pakej ${p.pk} · Kolam ${p.jenis}</p>
    <h2>${esc(p.tm)} — ${p.id}</h2>
    <p class="addr">${esc(p.jl)}, ${esc(p.tm)}</p>
    <dl class="grid">
      ${f('Nama kawasan / taman', esc(p.tm))}
      ${f('No. kolam', `<span class="mono">${p.id}</span>`)}
      ${f('Pakej', 'Pakej ' + p.pk)}
      ${f('Jenis kolam', 'KOLAM ' + p.jenis.toUpperCase())}
      ${f('Keluasan (BQ)', num(p.luas, 2) + ' m²')}
      ${f('Lot / PTD', esc(p.ptd === '-' ? 'Tiada dalam senarai' : p.ptd))}
      ${f('Luas dasar', num(p.dasar, 2) + ' m²')}
      ${f('Luas tebing', num(p.tebing, 2) + ' m²')}
      ${f('Alamat', `${esc(p.jl)}, ${esc(p.tm)}`, 'full')}
      ${f('Koordinat GPS', `<span class="mono">${dms(p.lat, 'N', 'S')} ${dms(p.lng, 'E', 'W')}</span><br><a href="${maps}" target="_blank" rel="noopener">Buka di Google Maps →</a>`, 'full')}
    </dl>
    <p class="note">Sumber data: Senarai Aset Kolam Tadahan, MBIP. Koordinat GPS dipetakan melalui Google Maps.</p>
  </div>`;
}

function route() {
  const m = location.hash.match(/^#\/kolam\/([a-g]-\d{2})$/i);
  const p = m && PONDS.find((x) => slug(x.id) === m[1].toLowerCase());
  if (p) { detailView(p); window.scrollTo(0, 0); document.title = `${p.id} ${p.tm} — Daftar Kolam Tadahan MBIP`; }
  else { listView(); document.title = 'Daftar Kolam Tadahan — MBIP'; }
}
window.addEventListener('hashchange', route);
route();
</script>
